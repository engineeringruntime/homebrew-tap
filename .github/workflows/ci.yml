name: Homebrew tap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online_audit:
        description: "Run brew audit --online (homepage/URL reachability). Turn off only while the owner has the website down on purpose; record the exception."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runner: macos-15
          - platform: macOS Intel
            runner: macos-15-intel
          - platform: Linux arm64
            runner: ubuntu-24.04-arm
          - platform: Linux amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Locate Homebrew
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
            else
              echo "Homebrew is not installed on this runner" >&2
              exit 1
            fi
          fi

      - name: Tap this checkout
        shell: bash
        run: brew tap engineeringruntime/tap "$GITHUB_WORKSPACE"

      - name: Audit and style
        shell: bash
        run: |
          set -euo pipefail
          # Push/PR runs have no inputs and always audit online.
          if [ "${{ inputs.online_audit }}" = "false" ]; then
            echo "::warning::online audit skipped by dispatch input (homepage reachability not checked)"
            brew audit --strict engineeringruntime/tap/engineering-runtime
          else
            brew audit --strict --online engineeringruntime/tap/engineering-runtime
          fi
          brew style --formula engineeringruntime/tap/engineering-runtime

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          # The executable is whatever the formula installs: engrt from
          # v0.10.0, runtime before it. Each reads only its own Home
          # variable, so both are set to the same test Home.
          bin_name="$(sed -n 's/^ *bin\.install "\([^"]*\)"$/\1/p' Formula/engineering-runtime.rb)"
          case "$bin_name" in engrt|runtime) ;; *) echo "unexpected formula binary: $bin_name" >&2; exit 1 ;; esac
          brew install engineeringruntime/tap/engineering-runtime
          runtime_bin="$(brew --prefix)/bin/$bin_name"
          formula_version="$(brew info --json=v2 engineeringruntime/tap/engineering-runtime | jq -r '.formulae[0].versions.stable')"
          "$runtime_bin" version | grep -Fx "$bin_name $formula_version"
          ENGRT_HOME="$test_home" RUNTIME_HOME="$test_home" "$runtime_bin" config validate
          test -f "$test_home/version"
          brew test engineeringruntime/tap/engineering-runtime
          brew uninstall engineering-runtime
          test -f "$test_home/version"
          if [ -e "$(brew --prefix)/bin/$bin_name" ]; then
            echo "Homebrew-managed $bin_name remained on PATH after uninstall" >&2
            exit 1
          fi

      - name: Formula generator
        shell: bash
        run: ./scripts/test-update-formula.sh
