name: Update from latest Runtime release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact published stable release (vX.Y.Z); empty selects latest
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: update-runtime-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: Resolve requested stable release and confirm Latest
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          base=https://api.github.com/repos/engineeringruntime/engineering-runtime-releases/releases
          release_json="$(curl -fsSL "$base/latest")"
          latest="$(jq -r '.tag_name' <<<"$release_json")"
          if [ -n "$REQUESTED_RELEASE" ]; then
            if ! [[ "$REQUESTED_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid requested release tag" >&2
              exit 1
            fi
            if [ "$REQUESTED_RELEASE" != "$latest" ]; then
              echo "requested release is no longer Latest; refuse stale formula promotion" >&2
              exit 1
            fi
          fi
          version="$latest"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest release returned an invalid tag: $version" >&2
            exit 1
          fi
          if [ "$(jq -r '.draft or .prerelease' <<<"$release_json")" != "false" ]; then
            echo "latest release must be non-draft and non-prerelease" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download checksums and verify all formula assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          base="https://github.com/engineeringruntime/engineering-runtime-releases/releases/download/$version"
          curl -fsSL "$base/SHA256SUMS.txt" -o SHA256SUMS.txt
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            asset="engrt-$version-$platform.tar.gz"
            grep -Eq "^[0-9a-f]{64}  ${asset}$" SHA256SUMS.txt
            curl -fsSIL "$base/$asset" >/dev/null
          done

      - name: Validate formula generator
        shell: bash
        run: ./scripts/test-update-formula.sh

      - name: Generate formula
        shell: bash
        run: |
          ./scripts/update-formula.sh "${{ steps.release.outputs.version }}" SHA256SUMS.txt
          ruby -c Formula/engineering-runtime.rb

      - name: Commit changed formula
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/engineering-runtime.rb; then
            echo "Formula already matches ${{ steps.release.outputs.version }}"
            exit 0
          fi
          git config user.name "engineering-runtime-release-bot"
          git config user.email "engineering-runtime-release-bot@users.noreply.github.com"
          git add Formula/engineering-runtime.rb
          git commit -m "brew: update Engineering Runtime to ${{ steps.release.outputs.version }}"
          git push

      # Pushes authenticated by GITHUB_TOKEN do not start a push-triggered CI run.
      # workflow_dispatch is an allowed exception; request all four native lanes.
      - name: Request four-platform Homebrew verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml -R engineeringruntime/homebrew-tap --ref main
          {
            echo "### Homebrew distribution verification"
            echo "Formula generation completed for **${{ steps.release.outputs.version }}**."
            echo "Four-platform [Homebrew CI](https://github.com/engineeringruntime/homebrew-tap/actions/workflows/ci.yml) was dispatched."
            echo "Release closure still requires observing all required CI outcomes and installed-binary evidence."
          } >> "$GITHUB_STEP_SUMMARY"
